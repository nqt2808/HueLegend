name: Validate HueLegend
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run JavaScript tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Verify deploy output
        run: test -f dist/index.html && test -f dist/styles.css
